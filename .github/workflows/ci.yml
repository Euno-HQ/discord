name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Type check
        run: npm run typecheck --if-present

      # tsc doesn't load language-service plugins, so the Effect diagnostics
      # only gate CI through these.
      - name: Effect diagnostics
        run: npm run check:effect

      - name: Effect debt ratchet
        run: npm run effect:debt

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run vitest
        run: npm run test

  client-bundle:
    name: Client bundle guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Assert Effect not in client bundle
        run: npm run check:client-bundle

  infra-lint:
    name: Shell + Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # shellcheck is preinstalled on ubuntu-latest. -x follows the
      # `# shellcheck source=` directives into scripts/db-common.sh.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -x

      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
