apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mod-bot-uat
  namespace: staging
  labels:
    app: mod-bot-uat
spec:
  serviceName: mod-bot-uat
  replicas: 1
  # Single replica, so there's no ordering to protect. OrderedReady (the
  # default) refuses to replace a pod that isn't Ready, which can block a
  # deploy when the pod is crash-looping. See cluster/deployment.yaml.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mod-bot-uat
  template:
    metadata:
      labels:
        app: mod-bot-uat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # /data PVC is root-owned; fsGroup makes it group-writable for uid 1000.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mod-bot
          image: ghcr.io/euno-hq/discord:${IMAGE_TAG}
          imagePullPolicy: Always
          command: ["npm", "run", "start:staging"]
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Only writable paths besides /data: npm logs/cache, node compile cache.
            - mountPath: /tmp
              name: tmp
            - mountPath: "/data"
              name: mod-bot-data
          envFrom:
            - secretRef:
                name: mod-bot-staging-env
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/.npm
            - name: ENVIRONMENT
              value: staging
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "384Mi"
              cpu: 500m
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: mod-bot-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 256Mi
        storageClassName: do-block-storage
---
apiVersion: v1
kind: Service
metadata:
  name: mod-bot-uat
  namespace: staging
  labels:
    app: mod-bot-uat
spec:
  selector:
    app: mod-bot-uat
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mod-bot-uat
  namespace: staging
  labels:
    app: mod-bot-uat
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: uat.euno-staging.reactiflux.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mod-bot-uat
                port:
                  number: 80
  tls:
    - hosts:
        - uat.euno-staging.reactiflux.com
      secretName: uat-staging-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mod-bot-uat
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app: mod-bot-uat
  policyTypes: [Ingress, Egress]
  ingress:
    # Kubelet probes come from the node and are always allowed by Cilium.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          # matchExpressions, not matchLabels: kustomize commonLabels would
          # inject app=mod-bot into matchLabels and break DNS.
          podSelector:
            matchExpressions:
              - {key: k8s-app, operator: In, values: [kube-dns]}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Observed + code: Discord (API/gateway/CDN), Sentry, PostHog, Stripe, all
    # HTTPS. Private ranges (cluster, VPC, metadata service) are excluded.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8, 169.254.0.0/16]
      ports:
        - protocol: TCP
          port: 443
