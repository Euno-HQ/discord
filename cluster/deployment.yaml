apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mod-bot-set
spec:
  selector:
    matchLabels:
      app: mod-bot
  serviceName: "mod-bot"
  replicas: 1
  # Single replica, so there's no ordering to protect. OrderedReady (the
  # default) refuses to replace a pod that isn't Ready, which means a
  # crash-looping pod can permanently block deploys of the fix (2026-09-13
  # incident: the rollout wait timed out and the deploy workflow rolled back).
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mod-bot
    spec:
      containers:
        - name: mod-bot
          image: $(IMAGE)
          # Preserve the crashed container's last log output in
          # lastState.terminated.message (pod status), since container logs
          # are gone by the time anyone can look after a crash loop.
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - containerPort: 3000
          volumeMounts:
            - mountPath: "/data"
              name: mod-bot-pvc
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          envFrom:
            - secretRef:
                name: modbot-env
          env:
            - name: ENVIRONMENT
              value: production

  volumeClaimTemplates:
    - metadata:
        name: mod-bot-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: do-block-storage
